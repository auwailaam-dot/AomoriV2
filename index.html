<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本旅遊規劃</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#F8F9FA;--card:#fff;--tx:#2D3436;--mu:#8a9096;--bd:#e9ecef;--glass:rgba(248,249,250,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--tx:#eceff1;--mu:#9aa1a8;--bd:#2d3136;--glass:rgba(21,23,26,.8)}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--tx:#eceff1;--mu:#9aa1a8;--bd:#2d3136;--glass:rgba(21,23,26,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.hov:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn{background:#BC002D;color:#fff;border-radius:.75rem;padding:.5rem 1rem;font-weight:600}
.inp{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:.75rem;padding:.5rem .75rem}
.mu{color:var(--mu)}.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}.bar>i{display:block;height:100%;background:#BC002D;transition:width .4s}
.nav{display:block;width:100%;text-align:left;padding:.65rem .9rem;border-radius:.75rem;font-weight:600}
.nav.on{background:#BC002D;color:#fff}
.fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style></head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const uid=()=>Math.random().toString(36).slice(2,10);
const TYPES={Food:['🍽️','#f59e0b','餐廳','food'],Sightseeing:['📷','#3b82f6','景點','sightseeing'],Transport:['🚆','#10b981','交通','transport'],Hotel:['🏨','#8b5cf6','住宿','accommodation'],Shopping:['🛍️','#ec4899','購物','shopping'],Other:['📦','#6b7280','其他','other']};
const CATS={food:['🍽️ 餐飲','#f59e0b'],transport:['🚆 交通','#10b981'],accommodation:['🏨 住宿','#8b5cf6'],sightseeing:['📷 觀光','#3b82f6'],shopping:['🛍️ 購物','#ec4899'],other:['📦 其他','#6b7280']};
const WX={sun:['☀️','晴天'],cloudsun:['⛅','多雲'],cloud:['☁️','陰天'],rain:['🌧️','雨天'],snow:['🌨️','雪天']};
const CL=['✈️ 護照、簽證','💳 信用卡、現金','📱 手機、充電器','🧳 行李打包','🏨 飯店預訂確認','🎫 機票確認','💊 常用藥品','📸 相機、記憶卡','🌂 雨具','🔌 轉接頭'];
const WD=['日','一','二','三','四','五','六'];
const dd=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const nd=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)+1);
const today=()=>new Date().toISOString().slice(0,10);
const yen=n=>'¥'+Math.round(n).toLocaleString();
const fd=d=>d.slice(5).replace('-','/')+' 週'+WD[new Date(d+'T00:00:00Z').getUTCDay()];
const mkDay=(s,i)=>({day:i+1,date:dd(s,i),weather:{c:'cloudsun',lo:8,hi:17},activities:[]});
const mk=(title,s,e,cover,acts={})=>{const t={id:uid(),title,startDate:s,endDate:e,coverImage:cover||'',budget:{total:0,cats:{}},checklist:CL.map(item=>({item,completed:false})),dailyItinerary:Array.from({length:nd(s,e)},(_,i)=>mkDay(s,i))};
 Object.entries(acts).forEach(([i,l])=>t.dailyItinerary[i].activities=l.map(a=>({id:uid(),time:a[0],type:a[1],location:a[2],note:a[3]||'',cost:a[4]||0})));return t};
function seed(){return {page:'dash',cur:null,day:0,rate:0.055,trips:[
 mk('青森・東北秋之旅','2026-10-25','2026-10-31','',{
  0:[['08:10','Transport','HX604 香港→成田','13:20 抵達 NRT T1'],['15:00','Hotel','APA Hotel 上野駅南','入住',29208]],
  1:[['10:00','Transport','Times 新青森駅前取車','Freed 級 4 人，現場付款',74790],['11:30','Sightseeing','弘前採蘋果','上午'],['15:30','Shopping','青森市區手信','下午'],['18:00','Hotel','青森 Airbnb（西大野）','整棟',43000]],
  2:[['09:00','Sightseeing','城ヶ倉大橋'],['11:00','Sightseeing','八甲田纜車'],['14:00','Sightseeing','奧入瀨溪流'],['18:00','Hotel','八戶 Airbnb（旭ヶ丘）','近三澤機場',30474]],
  3:[['09:30','Sightseeing','十和田湖'],['13:00','Sightseeing','白神山地'],['17:00','Hotel','湯瀨酒店','含晚餐早餐',80920]],
  4:[['09:30','Sightseeing','八幡平'],['13:00','Sightseeing','抱返溪谷'],['17:00','Hotel','森之風鶯宿','和室 x2，含晚餐早餐',56320]],
  5:[['10:00','Transport','盛岡還車 → JR 往東京'],['11:00','Transport','Orix 東京駅八重洲口取車','7 人座',9750],['14:00','Shopping','御殿場 Premium Outlets'],['17:00','Hotel','APA Hotel TKP 日暮里駅前','',33816]],
  6:[['10:00','Transport','退房，前往成田'],['20:25','Transport','HX611 成田→香港','00:50 抵達']]}),
 mk('東京櫻花季（範例）','2027-03-25','2027-03-28','',{0:[['10:00','Sightseeing','淺草寺','',0],['12:30','Food','一蘭拉麵','',1500]]})]}}
let S=null;try{S=JSON.parse(localStorage.getItem('jtp'))}catch(e){}
if(!S||!S.trips)S=seed();
const save=()=>{try{localStorage.setItem('jtp',JSON.stringify(S))}catch(e){}};
const T=()=>S.trips.find(t=>t.id===S.cur)||S.trips[0];
const spent=t=>t.dailyItinerary.reduce((a,d)=>a+d.activities.reduce((b,x)=>b+(+x.cost||0),0),0)+(t.expenses||[]).reduce((a,x)=>a+(+x.amount||0),0);
const bycat=t=>{const o={};Object.keys(CATS).forEach(k=>o[k]=0);t.dailyItinerary.forEach(d=>d.activities.forEach(x=>o[(TYPES[x.type]||TYPES.Other)[3]]+=+x.cost||0));(t.expenses||[]).forEach(x=>{if(x.cat in o)o[x.cat]+=+x.amount||0});return o};
const go=(p,id)=>{S.page=p;if(id){S.cur=id;S.day=0}save();R();scrollTo(0,0)};

function modal(title,body,ok){const m=document.createElement('div');m.className='fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-md';m.style.background='rgba(0,0,0,.35)';
 m.innerHTML=`<form class="card fade w-full max-w-md p-5 space-y-3 overflow-auto" style="max-height:100%"><h3 class="font-bold text-lg">${title}</h3>${body}<div class="flex gap-2 justify-end pt-2"><button type="button" class="px-4 py-2 mu" id="mx">取消</button><button class="btn">確定</button></div></form>`;
 document.body.appendChild(m);m.querySelector('#mx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 m.querySelector('form').onsubmit=async e=>{e.preventDefault();await ok(new FormData(e.target));m.remove();save();R()}}
const readImg=f=>new Promise(r=>{if(!f||!f.size)return r('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.onerror=()=>r('');im.src=fr.result};fr.readAsDataURL(f)});

function tripForm(t){const v=t||{title:'',startDate:'',endDate:''};
 modal(t?'編輯旅程':'新增旅程',`<input name="title" class="inp" placeholder="旅程名稱" value="${esc(v.title)}" required>
 <div class="grid grid-cols-2 gap-2"><label class="text-sm mu">開始<input type="date" name="s" class="inp" value="${v.startDate}" required></label><label class="text-sm mu">結束<input type="date" name="e" class="inp" value="${v.endDate}" required></label></div>
 <label class="text-sm mu block">封面圖片（上傳）<input type="file" name="img" accept="image/*" class="inp"></label>`,async f=>{
  const s=f.get('s'),e=f.get('e')<s?s:f.get('e'),img=await readImg(f.get('img'));
  if(t){t.title=f.get('title');t.startDate=s;t.endDate=e;if(img)t.coverImage=img;const n=nd(s,e);t.dailyItinerary=Array.from({length:n},(_,i)=>{const o=t.dailyItinerary[i]||mkDay(s,i);o.day=i+1;o.date=dd(s,i);return o})}
  else{const n=mk(f.get('title'),s,e,img);S.trips.push(n)}})}
function delTrip(id){modal('刪除旅程','<p>確定要刪除這個旅程嗎？此操作無法復原。</p>',()=>{S.trips=S.trips.filter(t=>t.id!==id);S.cur=null})}

function actForm(i){const d=T().dailyItinerary[S.day],a=i>=0?d.activities[i]:{type:'Sightseeing',time:'',location:'',note:'',cost:0};
 modal(i>=0?'編輯活動':'新增活動',`<div class="grid grid-cols-3 gap-2">${Object.entries(TYPES).map(([k,v])=>`<label class="cursor-pointer"><input type="radio" name="type" value="${k}" class="peer hidden" ${a.type===k?'checked':''}><span class="block text-center rounded-xl p-2 text-sm border peer-checked:ring-2 peer-checked:ring-[#BC002D]" style="border-color:var(--bd)">${v[0]}<br>${v[2]}</span></label>`).join('')}</div>
 <input type="time" name="time" class="inp" value="${a.time}" required><input name="location" class="inp" placeholder="地點名稱" value="${esc(a.location)}" required>
 <input name="note" class="inp" placeholder="備註" value="${esc(a.note)}"><input type="number" min="0" name="cost" class="inp" placeholder="預計花費（日圓）" value="${a.cost||''}">`,f=>{
  const n={id:a?.id||uid(),type:f.get('type')||'Other',time:f.get('time'),location:f.get('location'),note:f.get('note'),cost:+f.get('cost')||0};
  if(i>=0)d.activities[i]=n;else d.activities.push(n)})}
let dg=-1;
const mv=(a,b)=>{const L=T().dailyItinerary[S.day].activities;if(a<0||b<0||b>=L.length||a===b)return;L.splice(b,0,L.splice(a,1)[0]);save();R()};
const delAct=i=>{T().dailyItinerary[S.day].activities.splice(i,1);save();R()};
const addExp=(e,f)=>{e.preventDefault();const t=T();(t.expenses=t.expenses||[]).push({id:uid(),date:f.d.value||today(),cat:f.cat.value,note:f.note.value.trim(),amount:+f.amt.value||0});save();R()};
const delExp=id=>{const t=T();t.expenses=(t.expenses||[]).filter(x=>x.id!==id);save();R()};
const wx=(k,v)=>{T().dailyItinerary[S.day].weather[k]=v;save();R()};

const tripSel=()=>`<select class="inp mb-4" style="width:auto;max-width:100%" onchange="S.cur=this.value;S.day=0;save();R()">${S.trips.map(t=>`<option value="${t.id}" ${t.id===T().id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>`;
const empty=`<div class="card p-10 text-center mu">還沒有旅程，先到首頁新增一個吧。</div>`;

function dash(){const td=today();
 const cards=S.trips.map(t=>{const n=nd(t.startDate,t.endDate),planned=Math.round(100*t.dailyItinerary.filter(d=>d.activities.length).length/n),left=Math.round((new Date(t.startDate)-new Date(td))/864e5);
  const st=left>0?`還有 <b>${left}</b> 天出發`:td<=t.endDate?`旅程進行中 · 第 ${Math.round((new Date(td)-new Date(t.startDate))/864e5)+1} 天`:'旅程已結束';
  const bg=(t.coverImage?`url('${esc(t.coverImage)}') center/cover,`:'')+'linear-gradient(135deg,#BC002D,#FFB7C5)';
  return `<div class="card hov overflow-hidden cursor-pointer" onclick="go('trip','${t.id}')"><div class="h-36 relative" style="background:${bg}"><details class="absolute top-2 right-2" onclick="event.stopPropagation()"><summary class="glass rounded-full w-8 h-8 flex items-center justify-center cursor-pointer list-none">⋯</summary><div class="card p-1 mt-1 absolute right-0 w-24 z-10"><button class="nav" onclick="tripForm(S.trips.find(x=>x.id==='${t.id}'))">編輯</button><button class="nav" style="color:#BC002D" onclick="delTrip('${t.id}')">刪除</button></div></details></div>
  <div class="p-4 space-y-2"><div class="font-bold text-lg">${esc(t.title)}</div><div class="text-sm mu">${t.startDate} → ${t.endDate} · ${n} 天</div><div class="text-sm">${st}</div><div class="bar"><i style="width:${planned}%"></i></div><div class="text-xs mu">行程規劃完成 ${planned}%</div></div></div>`}).join('');
 return `<h1 class="text-3xl font-bold">我的旅程</h1><p class="mu mb-6">開始規劃你的下一趟旅行</p><div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">${cards}</div>
 <button onclick="tripForm()" class="w-full mt-5 rounded-2xl p-5 font-semibold border-2 border-dashed" style="border-color:#f97316;color:#f97316">＋ 新增旅程</button>`}

function trip(){const t=T();if(!t)return empty;if(S.day>=t.dailyItinerary.length)S.day=0;const d=t.dailyItinerary[S.day];
 const days=t.dailyItinerary.map((x,i)=>`<button onclick="S.day=${i};save();R()" class="shrink-0 rounded-2xl p-3 text-left text-sm md:w-full" style="${i===S.day?'background:linear-gradient(135deg,#BC002D,#e0405f);color:#fff':'background:var(--card);border:1px solid var(--bd)'}"><b>Day ${x.day}</b> ${WX[x.weather.c][0]}<br><span style="opacity:.8">${fd(x.date)}</span><br><span style="opacity:.8">${x.activities.length} 項活動</span></button>`).join('');
 const acts=d.activities.map((a,i)=>{const ty=TYPES[a.type]||TYPES.Other;return `<div class="flex gap-3" draggable="true" ondragstart="dg=${i}" ondragover="event.preventDefault()" ondrop="mv(dg,${i})">
  <div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0" style="background:${ty[1]}22">${ty[0]}</div><div class="flex-1 w-px" style="background:var(--bd)"></div></div>
  <div class="card hov flex-1 p-3 mb-3 min-w-0"><div class="flex justify-between gap-2"><div class="min-w-0"><span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:${ty[1]}22;color:${ty[1]}">${ty[2]}</span> <span class="text-sm mu">${esc(a.time)}</span><div class="font-semibold mt-1">${esc(a.location)}</div>${a.note?`<div class="text-sm mu">${esc(a.note)}</div>`:''}${a.cost?`<div class="text-sm mt-1">${yen(a.cost)}</div>`:''}</div>
  <div class="flex flex-col items-end gap-1 text-sm shrink-0"><span class="mu cursor-grab" title="拖拽排序">⠿</span><span><button onclick="mv(${i},${i-1})">↑</button> <button onclick="mv(${i},${i+1})">↓</button></span><span><button onclick="actForm(${i})">✏️</button> <button onclick="delAct(${i})">🗑️</button></span></div></div></div></div>`}).join('');
 return `${tripSel()}<div class="flex flex-col md:flex-row gap-4"><div class="flex md:flex-col gap-2 overflow-x-auto md:w-40 shrink-0 md:self-start">${days}</div>
 <div class="flex-1 min-w-0"><div class="card p-3 mb-4 flex flex-wrap items-center gap-2"><span class="text-2xl">${WX[d.weather.c][0]}</span><select class="inp" style="width:auto" onchange="wx('c',this.value)">${Object.entries(WX).map(([k,v])=>`<option value="${k}" ${k===d.weather.c?'selected':''}>${v[1]}</option>`).join('')}</select>
  <label class="text-sm mu">最低 <input type="number" class="inp" style="width:4.5rem" value="${d.weather.lo}" onchange="wx('lo',+this.value)">°C</label><label class="text-sm mu">最高 <input type="number" class="inp" style="width:4.5rem" value="${d.weather.hi}" onchange="wx('hi',+this.value)">°C</label></div>
  <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-xl">Day ${d.day} · ${fd(d.date)}</h2><button class="btn" onclick="actForm(-1)">＋ 活動</button></div>
  ${acts||'<div class="card p-8 text-center mu">這天還沒有活動</div>'}</div></div>`}

function budget(){const t=T();if(!t)return empty;const sp=spent(t),tot=+t.budget.total||0,c=bycat(t),over=tot>0&&sp>tot;let a=0;
 const stops=Object.keys(CATS).filter(k=>c[k]>0).map(k=>{const p=c[k]/sp*100,s=`${CATS[k][1]} ${a}% ${a+p}%`;a+=p;return s});
 const pie=sp>0?`conic-gradient(${stops.join(',')})`:'var(--bd)';
 const rows=Object.entries(CATS).map(([k,v])=>{const cap=+(t.budget.cats||{})[k]||0,ov=cap>0&&c[k]>cap,p=sp?c[k]/sp*100:0;
  return `<div class="card p-3 ${ov?'':''}" style="${ov?'background:#BC002D18;border-color:#BC002D':''}"><div class="flex justify-between items-center gap-2"><b>${v[0]}</b><span>${yen(c[k])} · ${p.toFixed(0)}%</span></div><div class="bar my-2"><i style="width:${p}%;background:${ov?'#BC002D':v[1]}"></i></div><label class="text-xs mu">類別預算 ¥ <input type="number" min="0" class="inp" style="width:7rem;padding:.2rem .5rem" value="${cap||''}" onchange="T().budget.cats['${k}']=+this.value;save();R()">${ov?' <b style="color:#BC002D">超支 '+yen(c[k]-cap)+'</b>':''}</label></div>`}).join('');
 return `${tripSel()}<h1 class="text-3xl font-bold mb-4">預算追蹤</h1><div class="grid grid-cols-3 gap-3 mb-4">
 <div class="card p-4"><div class="text-xs mu">總預算</div><input type="number" min="0" class="inp mt-1" value="${tot||''}" placeholder="輸入" onchange="T().budget.total=+this.value;save();R()"></div>
 <div class="card p-4" style="${over?'background:#BC002D18;border-color:#BC002D':''}"><div class="text-xs mu">已花費</div><div class="text-xl font-bold mt-2">${yen(sp)}</div></div>
 <div class="card p-4"><div class="text-xs mu">剩餘預算</div><div class="text-xl font-bold mt-2" style="${over?'color:#BC002D':''}">${tot?yen(tot-sp):'未設定'}</div></div></div>
 ${over?`<div class="card p-3 mb-4 font-semibold" style="color:#BC002D;border-color:#BC002D">⚠️ 已超出總預算 ${yen(sp-tot)}</div>`:''}
 <div class="grid md:grid-cols-[220px_1fr] gap-4"><div class="card p-5 flex items-center justify-center"><div class="rounded-full" style="width:170px;height:170px;background:${pie};-webkit-mask:radial-gradient(circle 52px,transparent 98%,#000 100%);mask:radial-gradient(circle 52px,transparent 98%,#000 100%)"></div></div><div class="space-y-3">${rows}</div></div>
 <div class="card p-4 mt-4"><div class="font-bold mb-2">記錄實際開支</div>
 <form class="flex flex-wrap gap-2" onsubmit="addExp(event,this)"><input name="note" class="inp" style="flex:2 1 10rem" placeholder="項目（例：便利店）" required>
 <input name="amt" type="number" min="1" class="inp" style="flex:1 1 6rem" placeholder="金額 ¥" required>
 <select name="cat" class="inp" style="flex:1 1 7rem">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
 <input name="d" type="date" class="inp" style="flex:1 1 8rem" value="${today()}"><button class="btn" style="flex:1 1 5rem">＋ 新增</button></form>
 <div class="mt-3 space-y-1">${[...(t.expenses||[])].reverse().map(x=>`<div class="flex items-center gap-2 py-1.5 border-t text-sm" style="border-color:var(--bd)"><span class="mu shrink-0">${x.date.slice(5).replace('-','/')}</span><span class="shrink-0">${CATS[x.cat]?CATS[x.cat][0].split(' ')[0]:'📦'}</span><span class="flex-1 min-w-0 truncate">${esc(x.note)}</span><b>${yen(x.amount)}</b><button onclick="delExp('${x.id}')" aria-label="刪除">🗑️</button></div>`).join('')||'<div class="text-sm mu">未有記錄，旅途中隨時可以加。</div>'}</div></div>
 <p class="text-xs mu mt-3">已花費 = 每日行程活動的預計花費 + 上面記錄的實際開支。</p>`}

const cv=(src)=>{const r=S.rate,j=$('#jpy'),h=$('#hkd');if(src==='j')h.value=(j.value*r).toFixed(2);else j.value=Math.round(h.value/r);$('#sl').value=j.value};
function tools(){const t=T();if(!t)return empty;const done=t.checklist.filter(x=>x.completed).length,p=Math.round(100*done/Math.max(1,t.checklist.length));
 return `${tripSel()}<h1 class="text-3xl font-bold mb-4">旅行工具</h1><div class="grid md:grid-cols-2 gap-4">
 <div class="card p-5"><div class="font-bold mb-2">出發前檢查清單 <span class="mu text-sm">${done}/${t.checklist.length}</span></div><div class="bar mb-3"><i style="width:${p}%"></i></div>
 ${t.checklist.map((x,i)=>`<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="checkbox" ${x.completed?'checked':''} onchange="T().checklist[${i}].completed=this.checked;save();R()" style="accent-color:#BC002D;width:18px;height:18px"><span style="${x.completed?'text-decoration:line-through;opacity:.5':''}">${esc(x.item)}</span></label>`).join('')}
 <form class="flex gap-2 mt-3" onsubmit="event.preventDefault();const v=this.n.value.trim();if(v){T().checklist.push({item:v,completed:false});save();R()}"><input name="n" class="inp" placeholder="新增自訂項目"><button class="btn">＋</button></form></div>
 <div class="card p-5 self-start"><div class="font-bold mb-3">貨幣轉換器</div>
 <label class="text-sm mu">JPY 日圓</label><input id="jpy" type="number" class="inp mb-2" value="10000" oninput="cv('j')">
 <input id="sl" type="range" min="0" max="100000" step="500" value="10000" class="w-full mb-3" style="accent-color:#BC002D" oninput="$('#jpy').value=this.value;cv('j')">
 <label class="text-sm mu">HKD 港幣</label><input id="hkd" type="number" class="inp mb-3" value="${(10000*S.rate).toFixed(2)}" oninput="cv('h')">
 <label class="text-sm mu">匯率：1 JPY = <input type="number" step="0.001" class="inp" style="width:6rem;display:inline-block" value="${S.rate}" onchange="S.rate=+this.value||S.rate;save();cv('j')"> HKD</label>
 <p class="text-xs mu mt-2">匯率為手動設定（頁面無法連線即時匯率服務），出發前請自行更新。</p></div></div>`}

const NAV=[['dash','🏠 首頁'],['trip','📅 行程規劃'],['budget','💰 預算追蹤'],['tools','🔧 旅行工具']];
const nav=()=>NAV.map(([k,l])=>`<button class="nav ${S.page===k?'on':''}" onclick="go('${k}');$('#mm')&&$('#mm').classList.add('hidden')">${l}</button>`).join('');
function R(){const P={dash,trip,budget,tools}[S.page]||dash;
 $('#app').innerHTML=`<aside class="hidden md:flex fixed inset-y-0 left-0 w-64 flex-col p-5 glass border-r z-30" style="border-color:var(--bd)"><div class="font-bold text-xl mb-6">✈️ 日本旅遊</div><nav class="space-y-1">${nav()}</nav><div class="mt-auto rounded-2xl p-4 text-sm" style="background:#FFB7C5;color:#5a1a2a">🌸 小提示：出發前記得確認簽證、機票與網卡。</div></aside>
 <header class="md:hidden sticky top-0 z-40 glass flex items-center justify-between px-4 py-3 border-b" style="border-color:var(--bd)"><b>✈️ 日本旅遊</b><button class="text-2xl" onclick="$('#mm').classList.toggle('hidden')" aria-label="選單">☰</button></header>
 <div id="mm" class="md:hidden hidden glass sticky z-30 p-2 border-b fade" style="top:3.1rem;border-color:var(--bd)">${nav()}</div>
 <main class="md:ml-64 p-4 md:p-8 max-w-5xl fade">${P()}</main>`}
R();
</script></body></html>
